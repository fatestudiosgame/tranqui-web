<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abriendo negocio VIP | Tranqui</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#FF9800 0%,#FF5722 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:white;border-radius:20px;padding:40px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.logo{font-size:48px;margin-bottom:20px}
h1{color:#FF5722;font-size:24px;margin-bottom:10px}
p{color:#666;margin-bottom:30px;line-height:1.6}
.loader{border:4px solid #f3f3f3;border-top:4px solid #FF5722;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.button{display:inline-block;background:#FF5722;color:white;padding:15px 40px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:16px;transition:all 0.3s;margin:10px}
.button:hover{background:#E64A19;transform:translateY(-2px)}
.button.secondary{background:#757575}
.button.secondary:hover{background:#616161}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="logo">&#127978;</div>
<h1 id="title">Abriendo pagina VIP...</h1>
<p id="message">Estamos abriendo la pagina del negocio en Tranqui</p>
<div id="loader" class="loader"></div>
<div id="actions" class="hidden">
<a href="#" id="openApp" class="button">Abrir en la App</a>
<a href="#" id="openWeb" class="button secondary">Ver en Web</a>
</div>
</div>
<script>
(function(){
var urlParams=new URLSearchParams(window.location.search);
var negocioId=urlParams.get('id');
if(!negocioId){
document.getElementById('title').textContent='Error';
document.getElementById('message').textContent='No se especifico ningun negocio';
document.getElementById('loader').classList.add('hidden');
return;
}
var webUrl='https://fatestudiosgame.github.io/tranqui-web/#/p/'+negocioId;
var appIntent='intent://p/'+negocioId+'#Intent;scheme=tranqui;package=com.fatestudiosgame.tranqui;end';
var isAndroid=/Android/i.test(navigator.userAgent);
if(isAndroid){
var iframe=document.createElement('iframe');
iframe.style.display='none';
iframe.src=appIntent;
document.body.appendChild(iframe);
setTimeout(function(){if(!document.hidden){showFallback();}},2000);
}else{showFallback();}
function showFallback(){
document.getElementById('loader').classList.add('hidden');
document.getElementById('actions').classList.remove('hidden');
document.getElementById('title').textContent='Como quieres verlo?';
document.getElementById('message').textContent='Elige si quieres abrir la app o ver la pagina del negocio en la web';
document.getElementById('openApp').href=appIntent;
document.getElementById('openWeb').href=webUrl;
}
})();
</script>
</body>
</html>
