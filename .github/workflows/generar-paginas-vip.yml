name: Generar paginas VIP
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar script
        run: node generar_vip.js
      - name: Commit y push
        run: |
          git config user.name "tranqui-bot"
          git config user.email "bot@tranqui.app"
          git add p/ sitemap.xml
          git diff --staged --quiet || (git commit -m "🤖 Actualizar paginas VIP [auto]" && git push)